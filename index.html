<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Viewer</title>

  <style>
    body {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: Arial, sans-serif;
      background: #f4f7f9;
      color: #17202a;
    }

    h1 {
      color: #123047;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #087f8c;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .post {
      margin: 14px 0;
      padding: 16px;
      border: 1px solid #d5e0e7;
      border-radius: 8px;
      background: white;
    }

    .post h2 {
      color: #087f8c;
      font-size: 20px;
      text-transform: capitalize;
    }

    .error {
    color: #b42318;
    }
 </style>
</head>

<body>
  <h1>Post Viewer</h1>

  <button id="loadButton">Load Posts</button>
  <p id="message"></p>
  <div id="posts"></div>

  <script>
    const loadButton = document.getElementById("loadButton");
    const message = document.getElementById("message");
    const postsContainer = document.getElementById("posts");

    async function loadPosts() {
      loadButton.disabled = true;
      message.textContent = "Loading posts...";
      message.className = "";
      postsContainer.innerHTML = "";

      try {
        const response = await fetch(
          "https://jsonplaceholder.typicode.com/posts"
        );

        if (!response.ok) {
          throw new Error("Request failed");
        }

        const posts = await response.json();

        posts.slice(0, 10).forEach(function (post) {
          const article = document.createElement("article");
          article.className = "post";

          const title = document.createElement("h2");
          title.textContent = post.title;

          const body = document.createElement("p");
          body.textContent = post.body;

          article.appendChild(title);
          article.appendChild(body);
          postsContainer.appendChild(article);
        });

        message.textContent = "Showing the first 10 posts.";
      } catch (error) {
        message.textContent = "Could not load posts. Please try again.";
        message.className = "error";
        console.error(error);
      } finally {
        loadButton.disabled = false;
      }
    }

    loadButton.addEventListener("click", loadPosts);
  </script>
</body>
</html>
